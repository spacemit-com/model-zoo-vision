# YOLO26 目标检测模型配置
# 默认模型路径为 yolo26n；可通过参数 model_path 覆盖该路径
# 仅支持 e2e 输出: [N, 6] 或 [1, N, 6]（已含 NMS）
model_path: ~/.cache/models/vision/yolo26/yolo26n.q.onnx
test_image: ~/.cache/assets/image/006_test.jpg
label_file_path: assets/labels/coco.txt
image_size: [640, 640]
class: deploy.yolo26.YOLO26Detector
default_params:
  conf_threshold: 0.25
  iou_threshold: 0.45
  num_threads: 8
  providers:
    - SpaceMITExecutionProvider
