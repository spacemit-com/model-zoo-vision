# Copied from examples/yolov8/config/yolov8.yaml; sync when upstream schema changes.
# Differs in: model_path, test_image, label_file_path
model_path: ~/.cache/models/vision/yolov8/yolov8_fire.q.onnx
test_image: ~/.cache/assets/image/002_fire.jpg
label_file_path: assets/labels/fire.txt
image_size: [640, 640]
class: deploy.yolov8.YOLOv8Detector
default_params:
  conf_threshold: 0.25
  iou_threshold: 0.45
  num_threads: 8
  providers:
    - SpaceMITExecutionProvider
