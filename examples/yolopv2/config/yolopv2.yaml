# YOLOPv2 road-scene multi-task model: vehicle detection + drivable area + lane line.
model_path: ~/.cache/models/vision/yolopv2/yolopv2_288x512_sim.q.onnx
test_image: ~/.cache/assets/image/020_yolop.jpg
label_file_path: assets/labels/yolop.txt
image_size: [288, 512]
class: deploy.yolopv2.YOLOPv2
default_params:
  conf_threshold: 0.30
  iou_threshold: 0.45
  max_det: 300
  num_threads: 8
  preprocess:
    backend: auto
  providers:
    - SpaceMITExecutionProvider
