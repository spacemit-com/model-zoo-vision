# YOLO-World open-vocabulary detector.
# Text prompts (= class vocabulary) come from default_params.prompts and can be
# overridden per inference (VisionServiceRequest.prompts / --prompts). Text
# features are computed by the CLIP text encoder once per distinct vocabulary
# and cached, so steady-state inference is pure vision.
model_path: ~/.cache/models/vision/yolo_world/yolov8s-worldv2.dynq.onnx
test_image: ~/.cache/assets/image/014_bus.jpg
class: deploy.yolo_world.YoloWorldDetector
default_params:
  clip_model_path: ~/.cache/models/vision/yolo_world/clip_text.onnx
  # BPE merges table ships with the repo (a static tokenizer asset, like labels),
  # so it lives under assets/ and is referenced repo-relative, not downloaded.
  bpe_merges_path: assets/clip/bpe_merges.txt
  prompts: [person, bus, car]
  conf_threshold: 0.25
  iou_threshold: 0.45
  num_threads: 8
  providers:
    - SpaceMITExecutionProvider
