# YOLO26n-Sem semantic segmentation, Cityscapes 19 classes.
# Download: bash examples/yolo26_sem/scripts/download_models.sh
model_path: ~/.cache/models/vision/yolo26_sem/yolo26n-sem.fp16.onnx
test_image: ~/.cache/assets/image/009_test_unet.jpg
label_file_path: assets/labels/cityscapes.txt
class: deploy.yolo26_sem.YOLO26SemanticSegmentor
default_params:
  num_threads: 8
  num_classes: 19
  preprocess:
    backend: auto
  providers:
    - SpaceMITExecutionProvider
