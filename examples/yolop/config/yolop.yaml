# YOLOP road-scene multi-task model: vehicle detection + drivable area + lane line.
model_path: ~/.cache/models/vision/yolop/yolop-288-512-sim.q.onnx
test_image: ~/.cache/assets/image/020_yolop.jpg
label_file_path: assets/labels/yolop.txt
image_size: [288, 512]
class: deploy.yolop.YOLOP
default_params:
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 300
  num_threads: 8
  preprocess:
    backend: cpu
  providers:
    - SpaceMITExecutionProvider
