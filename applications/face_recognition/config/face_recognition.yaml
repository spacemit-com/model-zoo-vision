# Face recognition app entry (buffalo_l pipeline).
# C++ demo input; existing command-line input options take precedence.
input:
  type: image                 # Uses the existing default image when source is omitted.
  # For camera input, change type to camera and uncomment the options below.
  # source: /dev/video0
  # backend: opencv           # MPP is not supported by this application.
  # width: 1280
  # height: 720
  # fps: 30

scrfd_model: scrfd.yaml
arcface_model: arcface_buffalo.yaml
genderage_model: genderage.yaml
landmark106_model: landmark2d106.yaml

enable_landmark106: false
recognize_threshold: 0.3
face_db_dir: ~/.cache/face_db
output_image: output_face_recognition.jpg

test_image: ~/.cache/assets/image/001_emotion.jpg
