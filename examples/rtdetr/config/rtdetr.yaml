# RT-DETRv2-S COCO object detector.
model_path: ~/.cache/models/vision/rtdetr/rtdetrv2_s.fp16.onnx
test_image: ~/.cache/assets/image/006_test.jpg
label_file_path: assets/labels/coco.txt
class: deploy.rtdetr.RTDETRDetector
default_params:
  conf_threshold: 0.3
  num_threads: 8
  preprocess:
    backend: auto
    opencl_sampling: opencv_compatible
  providers:
    - SpaceMITExecutionProvider
