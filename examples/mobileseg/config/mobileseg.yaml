# MobileSeg MobileNetV2 semantic segmentation, Cityscapes 19 classes.
# Download: bash examples/mobileseg/scripts/download_models.sh
model_path: ~/.cache/models/vision/mobileseg/mobileseg_mobilenetv2_cityscapes_1024x512.q.onnx
test_image: ~/.cache/assets/image/009_test_unet.jpg
label_file_path: assets/labels/cityscapes.txt
class: deploy.mobileseg.MobileSeg
default_params:
  num_threads: 8
  num_classes: 19
  preprocess:
    backend: cpu
  providers:
    - SpaceMITExecutionProvider
