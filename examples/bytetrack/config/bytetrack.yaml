# ByteTrack 目标追踪模型配置
model_path: ~/.cache/models/vision/yolov8/yolov8n_no_dfl.q.onnx
test_video: ~/.cache/assets/video/003_palace.mp4
benchmark:
  scenario: video_tracking
image_size: [640, 640]
label_file_path: assets/labels/coco.txt
class: deploy.bytetrack.ByteTrackTracker
default_params:
  conf_threshold: 0.25
  iou_threshold: 0.45
  track_buffer: 30
  frame_rate: 30
  num_threads: 8
  preprocess:
    backend: auto
  providers:
    - SpaceMITExecutionProvider

# Camera settings apply only with --use-camera; command-line options override them.
camera:
  backend: opencv           # Capture backend: opencv / mpp; not preprocessing. Use mpp or --use-mpp when available.
  device: /dev/video0
  width: 1280
  height: 720
  fps: 30
