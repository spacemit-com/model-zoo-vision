# YOLO12 目标检测模型配置
# 单输出格式 [1, 84, 8400]，与 YOLOv8 官方导出一致
model_path: ~/.cache/models/vision/yolo12/yolo12n.q.onnx
test_image: ~/.cache/assets/image/006_test.jpg
label_file_path: assets/labels/coco.txt
image_size: [640, 640]
class: deploy.yolov8.YOLOv8Detector
default_params:
  conf_threshold: 0.25
  iou_threshold: 0.45
  num_threads: 8
  providers:
    - SpaceMITExecutionProvider
