# Copied from examples/yolov8_pose/config/yolov8_pose.yaml; sync when upstream schema changes.
# Differs in: model_path, test_image
model_path: ~/.cache/models/vision/yolov8_pose/yolov8n-pose.q.onnx
test_image: ~/.cache/assets/image/013_pose.jpg
label_file_path: assets/labels/coco.txt
image_size: [640, 640]
class: deploy.yolov8_pose.YOLOv8PoseDetector
default_params:
  conf_threshold: 0.25
  iou_threshold: 0.45
  point_confidence_threshold: 0.2
  num_threads: 8
  providers:
    - SpaceMITExecutionProvider
