# RTMPose accepts a BGR image of any size and fits it to 192x256 internally.
# The examples prewarp one person to 192x256, so the model skips a second warp.
model_path: ~/.cache/models/vision/rtmpose/rtmpose_m.fp16.onnx
test_image: ~/.cache/assets/image/013_pose.jpg
# Example-only person box for the default image, [x1, y1, x2, y2].
# The generic benchmark uses the full test_image and ignores this box.
test_bbox: [277, 40, 500, 390]
class: deploy.rtmpose.RTMPoseEstimator
default_params:
  conf_threshold: 0.25
  num_threads: 8
  providers:
    - SpaceMITExecutionProvider
