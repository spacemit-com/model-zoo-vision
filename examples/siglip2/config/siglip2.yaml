# SigLIP2 dual-tower image-text embedding.
model_path: ~/.cache/models/vision/siglip2/siglip2_vision_encoder_fp16_proj_dynq.onnx
test_image: ~/.cache/assets/image/007_dog.jpg
image_size: [224, 224]
class: deploy.siglip2.Siglip2Encoder
default_params:
  text_model_path: ~/.cache/models/vision/siglip2/siglip2_text_encoder_dynq.onnx
  tokenizer_path: ~/.cache/models/vision/siglip2/tokenizer.bin
  num_threads: 4
  providers:
    - CPUExecutionProvider
