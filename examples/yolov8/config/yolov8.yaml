# YOLOv8 目标检测模型配置
# 默认模型路径为 yolov8n_no_dfl；可通过参数 model_path 覆盖该路径
model_path: ~/.cache/models/vision/yolov8/yolov8n_no_dfl.q.onnx
test_image: ~/.cache/assets/image/006_test.jpg
# C++ demo input; command-line options take precedence.
input:
  type: image                 # image / camera; image source defaults to test_image
  # To use a camera, change type above to camera and uncomment the options below.
  # source: /dev/video0        # Select the actual camera device.
  # backend: mpp              # Camera capture: opencv (default) / mpp; not preprocessing.
  # width: 1280               # Optional capture requests, also supported by OpenCV.
  # height: 720
  # fps: 30
label_file_path: assets/labels/coco.txt
image_size: [640, 640]
class: deploy.yolov8.YOLOv8Detector
default_params:
  conf_threshold: 0.25
  iou_threshold: 0.45
  num_threads: 8
  providers:
    - SpaceMITExecutionProvider
  preprocess:
    # cpu / opencl / v2d / auto; auto: BGR -> CPU, NV12 DMA -> V2D/OpenCL/CPU
    backend: auto
    # Explicit hardware backend unavailable/unsupported: error (default) / cpu
    fallback: error
    # Only affects OpenCL NV12 sampling, never enables V2D.
    opencl_sampling: opencv_compatible
