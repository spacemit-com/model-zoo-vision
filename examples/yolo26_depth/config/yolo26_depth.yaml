# YOLO26n-Depth monocular metric depth estimation.
# Download: bash examples/yolo26_depth/scripts/download_models.sh
model_path: ~/.cache/models/vision/yolo26_depth/yolo26n-depth.fp16.onnx
test_image: ~/.cache/assets/image/006_test.jpg
class: deploy.yolo26_depth.YOLO26DepthEstimator
default_params:
  num_threads: 8
  preprocess:
    backend: auto
  providers:
    - SpaceMITExecutionProvider
