# YOLOE open-vocabulary detection: text / visual / fused prompts.
model_path: ~/.cache/models/vision/yoloe_detect/yoloe26n_vp_det_sim.fp16.onnx
test_image: ~/.cache/assets/image/014_bus.jpg
class: deploy.yoloe_detect.YOLOEDetector
default_params:
  text_model_path: ~/.cache/models/vision/yoloe_detect/yoloe26n_text_sim.fp16.onnx
  vpe_model_path: ~/.cache/models/vision/yoloe_detect/yoloe26n_vpe_sim.fp16.onnx
  bpe_merges_path: assets/clip/bpe_merges.txt
  prompts: [person, bus]
  conf_threshold: 0.2
  num_threads: 8
  prompt_num_threads: 2
  preprocess:
    backend: cpu
  providers:
    - SpaceMITExecutionProvider
