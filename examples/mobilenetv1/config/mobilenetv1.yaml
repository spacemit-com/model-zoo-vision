# MobileNetV1 图像分类模型配置
# MobileNetV1 输出 1001 类（index 0 为 background），使用独立 deploy 实现截掉背景类。
model_path: ~/.cache/models/vision/mobilenet/mobilenet_v1.q.onnx
test_image: ~/.cache/assets/image/005_kitten.jpg
label_file_path: assets/labels/imagenet.txt
image_size: [224, 224]
class: deploy.mobilenet.MobileNetV1Classifier
default_params:
  num_threads: 8
  resize_size: [256, 256]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  center_crop: true
  providers:
    - SpaceMITExecutionProvider
