# MobileNet 图像分类模型配置 (V2 / V3-Large / V3-Small)
# 三者预处理一致，可用 --model-path 切换。MobileNetV1 见 examples/mobilenetv1。
model_path: ~/.cache/models/vision/mobilenet/mobilenet_v2.q.onnx
test_image: ~/.cache/assets/image/005_kitten.jpg
label_file_path: assets/labels/imagenet.txt
image_size: [224, 224]
class: deploy.resnet.ResNetClassifier
default_params:
  num_threads: 8
  resize_size: [256, 256]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  center_crop: true
  providers:
    - SpaceMITExecutionProvider
