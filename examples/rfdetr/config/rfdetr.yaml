# RF-DETR Nano COCO object detector.
model_path: ~/.cache/models/vision/rfdetr/rfdetr-nano.fp16.onnx
test_image: ~/.cache/assets/image/006_test.jpg
label_file_path: assets/labels/coco_sparse.txt
class: deploy.rfdetr.RFDETRDetector
default_params:
  conf_threshold: 0.3
  max_det: 300
  num_threads: 8
  preprocess:
    backend: auto
    opencl_sampling: opencv_compatible
  providers:
    - SpaceMITExecutionProvider
