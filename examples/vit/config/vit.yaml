# ViT-B/16 图像分类模型配置
# 官方预处理与 ResNet 一致：resize 256 + center crop 224 + bilinear + ImageNet 归一化。
model_path: ~/.cache/models/vision/vit/vit_b_16.q.onnx
test_image: ~/.cache/assets/image/005_kitten.jpg
label_file_path: assets/labels/imagenet.txt
image_size: [224, 224]
class: deploy.resnet.ResNetClassifier
default_params:
  num_threads: 8
  resize_size: [256, 256]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  center_crop: true
  providers:
    - SpaceMITExecutionProvider
