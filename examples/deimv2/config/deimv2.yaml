# DEIMv2-N COCO object detector.
model_path: ~/.cache/models/vision/deimv2/deimv2n.fp16.onnx
test_image: ~/.cache/assets/image/006_test.jpg
label_file_path: assets/labels/coco.txt
image_size: [640, 640]
class: deploy.deimv2.DEIMv2Detector
default_params:
  conf_threshold: 0.4
  num_threads: 8
  preprocess:
    backend: auto
    opencl_sampling: opencv_compatible
    normalize: auto
  providers:
    - SpaceMITExecutionProvider
