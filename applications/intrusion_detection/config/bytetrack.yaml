# Copied from examples/bytetrack/config/bytetrack.yaml; sync when upstream schema changes.
# Differs in: model_path
model_path: ~/.cache/models/vision/yolov8/yolov8n_no_dfl.q.onnx
test_image: ~/.cache/assets/image/006_test.jpg
label_file_path: assets/labels/coco.txt
image_size: [640, 640]
class: deploy.bytetrack.ByteTrackTracker
default_params:
  conf_threshold: 0.25
  iou_threshold: 0.45
  track_buffer: 30
  frame_rate: 30
  num_threads: 8
  providers:
    - SpaceMITExecutionProvider
