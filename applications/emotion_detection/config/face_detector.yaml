# Copied from examples/yolov5-face/config/yolov5-face.yaml; sync when upstream schema changes.
# Differs in: model_path
model_path: ~/.cache/models/vision/yolov5-face/yolov5n-face_cut.q.onnx
class: deploy.yolov5_face.YOLOv5FaceDetector
default_params:
  conf_thres: 0.25
  iou_thres: 0.45
  conf_threshold: 0.25
  iou_threshold: 0.45
  num_threads: 4
  providers:
    - SpaceMITExecutionProvider
