# YOLO26-Seg COCO instance segmentation. Use --model-path for s/m variants.
model_path: ~/.cache/models/vision/yolo26_seg/yolo26n-seg.fp16.onnx
test_image: ~/.cache/assets/image/006_test.jpg
label_file_path: assets/labels/coco.txt
class: deploy.yolo26_seg.YOLO26SegSegmentor
default_params:
  conf_threshold: 0.25
  mask_threshold: 0.5
  num_threads: 8
  preprocess:
    backend: auto
  providers:
    - SpaceMITExecutionProvider
