# SCRFD face detection with five landmarks; shares weights with face_recognition.
model_path: ~/.cache/models/vision/buffalo_l/det_10g_fixed.q.onnx
test_image: ~/.cache/assets/image/006_test.jpg
class: deploy.scrfd.ScrfdDetector
default_params:
  conf_threshold: 0.5
  nms_threshold: 0.4
  num_threads: 8
  providers:
    - SpaceMITExecutionProvider
